<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="tgRb3wQTqsKb79eoSZt4DTt-ggcg_d4HoLQf0slL_cM" />
    <title>Chasy P</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/png" sizes="240x240" href="/favicon-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="240x240" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        fencedframe, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #blackout {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 100ms ease;
        }
        html.is-black #blackout {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <fencedframe id="frame" title="Chasy P" allow="clipboard-read; clipboard-write"></fencedframe>
    <div id="blackout" aria-hidden="true"></div>

    <script>
        const h = "h";
        const t = "t";
        const t2 = "t";
        const p = "p";
        const s = "s";
        const colon = ":";
        const slash = "/";
        const slash2 = "/";

        const e = "x";
        const x = ".";
        const a = "g";
        const m = "d";
        const p2 = "/";
        const l = "C";
        const e2 = "h";
        const dot = "a";
        const c = "s";
        const o = "y";
        const m2 = "_";
        const add = "P";
        const cc = "_";

        const url =
            h + t + t2 + p + s + colon + slash + slash2 +
            e + x + a + m + p2 + l + e2 +
            dot +
            c + o + m2 + add + cc;

        const blackout = () => {
            document.documentElement.classList.add("is-black");
        };

        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                event.preventDefault();
                blackout();
            }
        }, true);

        (function loadFrame() {
            const frame = document.getElementById("frame");

            if (window.FencedFrameConfig) {
                try {
                    frame.config = new FencedFrameConfig(url);
                    return;
                } catch (err) {
                }
            }

            const fallback = document.createElement("iframe");
            fallback.src = url;
            fallback.title = "Chasy P";
            fallback.setAttribute("allow", "clipboard-read; clipboard-write");
            fallback.addEventListener("load", () => {
                try {
                    fallback.contentDocument.addEventListener("keydown", (event) => {
                        if (event.key === "Escape") {
                            event.preventDefault();
                            blackout();
                        }
                    }, true);
                } catch (err) {
                    // Cross-origin frames cannot be inspected by this page.
                }
            });

            frame.replaceWith(fallback);
        })();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker 登録成功'))
                .catch(err => console.error('Service Worker 登録失敗', err));
        }
    </script>
</body>
</html>
